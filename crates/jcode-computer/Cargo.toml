[package]
name = "jcode-computer"
version = "1.0.3"
edition = "2024"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1"
base64 = "0.22"
core-foundation = "0.9"
core-graphics = { version = "0.23", features = ["highsierra"] }
jcode-base = { path = "../jcode-base", default-features = false }
jcode-tool-types = { path = "../jcode-tool-types" }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
jcode-base = { path = "../jcode-base", default-features = false, features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt"] }
