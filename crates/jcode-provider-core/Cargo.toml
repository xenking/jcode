[package]
name = "jcode-provider-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "jcode_provider_core"
path = "src/lib.rs"

[features]
blocking-http = ["reqwest/blocking"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
flate2 = "1"
# Request-body compression for api.openai.com, which accepts only identity or
# zstd. Default features off: we only need the bulk encoder.
zstd = { version = "0.14", default-features = false }
futures = "0.3"
httpdate = "1"
jcode-logging = { path = "../jcode-logging" }
jcode-schema-dialect = { path = "../jcode-schema-dialect" }
jcode-message-types = { path = "../jcode-message-types" }
jcode-usage-types = { path = "../jcode-usage-types" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9.3"
tokio = { version = "1", features = ["sync", "time", "macros", "io-util"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
