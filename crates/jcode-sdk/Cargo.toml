[package]
name = "jcode-sdk"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust SDK for the jcode harness API: connect, drive sessions, stream events"

[dependencies]
jcode-build-support = { path = "../jcode-build-support" }
anyhow = "1"
base64 = "0.22"
jcode-harness-api = { path = "../jcode-harness-api" }
jcode-applet-types = { path = "../jcode-applet-types" }
jcode-todo-policy = { path = "../jcode-todo-policy" }
jcode-provider-metadata = { path = "../jcode-provider-metadata" }
jcode-transport = { path = "../jcode-transport" }
jsonschema = { version = "0.49.3", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tempfile = "3"
url = "2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }
# tokio-tungstenite builds its wss connector from the process-level rustls provider.
# The Desktop graph enables both ring and aws-lc-rs, so rustls cannot pick one itself.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Jcode Cloud control plane (feature `cloud`).
ureq = { version = "3", features = ["json"], optional = true }
jcode-logging = { path = "../jcode-logging", optional = true }
# In-process SSH (feature `ssh-native`), for platforms without an `ssh` binary.
# Keep RSA disabled: native SSH generates Ed25519 keys and uses pinned host keys.
# russh 0.65 migrates the elliptic-curve stack to patched crypto-bigint 0.7.
russh = { version = "0.65", default-features = false, features = ["ring"], optional = true }
rand = { version = "0.10", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util", "macros"] }

[features]
default = []
# Account sign-in (email code, browser/device flow) and host wake/provision.
cloud = ["dep:ureq", "dep:jcode-logging"]
# Pure-Rust SSH transport with pinned host keys; also enables `cloud::connect`.
ssh-native = ["cloud", "dep:russh", "dep:rand"]

[dev-dependencies]
