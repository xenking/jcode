[package]
name = "jcode-storage"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
dirs = "5"
jcode-core = { path = "../jcode-core" }
libc = "0.2"
rand = "0.9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Resolves an unset JCODE_HOME to a per-process temp home instead of ~/.jcode.
# Enabled through jcode-base's test-support; never in production builds.
test-support = []

[dev-dependencies]
tempfile = "3"
jcode-harness-api = { path = "../jcode-harness-api" }
